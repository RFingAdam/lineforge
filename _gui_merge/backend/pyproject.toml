[project]
name = "atlc3-gui-backend"
version = "0.1.0"
description = "FastAPI backend for the atlc3 web GUI."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "atlc3>=1.0.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "RUF"]
ignore = [
    "RUF001",  # docstring ambiguous unicode (× ‚ etc) — atlc3 uses these freely
    "RUF002",
    "RUF003",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
