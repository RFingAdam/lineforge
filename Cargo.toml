[workspace]
members = ["crates/atlc3_kernel"]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["atlc3.0 contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/atlc3-project/atlc3"
homepage = "https://github.com/atlc3-project/atlc3"

[workspace.dependencies]
# pyo3 'extension-module' feature must NOT be enabled unconditionally — it
# tells the linker to leave Python symbols undefined (because the host
# Python provides them at runtime). When `cargo test` builds a test binary,
# there's no host Python, so the link fails on macOS. Each crate that uses
# pyo3 enables `extension-module` only via its own feature flag, defaulting
# to off. `maturin` enables it by passing `--features extension-module`.
pyo3 = { version = "0.22", features = ["abi3-py311"] }
numpy = "0.22"
ndarray = { version = "0.16", features = ["rayon"] }
rayon = "1.10"
sprs = "0.11"
thiserror = "1.0"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.dev]
opt-level = 1
