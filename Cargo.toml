[workspace]
members = ["crates/atlc3_kernel"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["atlc3.0 contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/atlc3-project/atlc3"
homepage = "https://github.com/atlc3-project/atlc3"

[workspace.dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311"] }
numpy = "0.22"
ndarray = { version = "0.16", features = ["rayon"] }
rayon = "1.10"
sprs = "0.11"
thiserror = "1.0"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.dev]
opt-level = 1
