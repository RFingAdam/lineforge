# The macOS and Windows lanes were dropped when CI moved to the homelab
# runners: the pool is Linux x64 only. Whatever those lanes covered is
# uncovered now -- said here rather than left silent. Restoring it needs a
# Windows or macOS runner in the pool, not a change to this file.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PYTHONUNBUFFERED: "1"

jobs:
  python-lint:
    name: Python lint + type-check
    runs-on: [self-hosted, Linux, X64, haven]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip maturin
          pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: black --check
        run: black --check .

      - name: mypy
        run: mypy src/lineforge

  rust-lint:
    name: Rust lint
    runs-on: [self-hosted, Linux, X64, haven]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        # See cargo test note re: --all-features and extension-module.
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python-version }})
    needs: [python-lint, rust-lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    [self-hosted, Linux, X64, haven]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip maturin
          pip install -e ".[dev]"

      - name: cargo test
        # Don't use --all-features: that enables `pyo3/extension-module`,
        # which leaves Python symbols undefined at link time (intentionally
        # for wheels, but breaks `cargo test` since there's no host Python
        # to resolve them at runtime).
        run: cargo test --workspace

      - name: pytest
        run: pytest -v --cov=lineforge --cov-report=xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
