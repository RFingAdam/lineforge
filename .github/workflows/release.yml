name: Release

on:
  push:
    tags:
      - "v*"
  # A change to the release path is proved here, up to the upload, before it can reach a tag.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/lineforge_kernel/Cargo.toml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  sdist:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # PyPI never lets a version be reused, so catch mistakes here. This check and the version
      # check below are not a security boundary, because a tagged commit can edit this file. The
      # repository's tag ruleset and the pypi environment's tag policy restrict publishing.
      - name: Refuse a tag that is not on main
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.16.0
          command: sdist
          args: --out dist

      - name: Refuse a tag that does not match the package version
        if: github.ref_type == 'tag'
        run: test -f "dist/lineforge-${GITHUB_REF_NAME#v}.tar.gz"

      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/
          if-no-files-found: error

  # Every crate comes from Cargo.lock (--locked) and maturin is one pinned release. abi3-py311 makes
  # each target a single wheel that loads on Python 3.11 and later.
  wheels:
    name: Build wheel (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64
          - runner: ubuntu-24.04
            target: aarch64
          - runner: macos-15
            target: universal2-apple-darwin
          - runner: windows-2025
            target: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.16.0
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto

      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  # Each wheel runs on its own platform, from a clean environment with nothing from the checkout.
  verify-wheels:
    name: Verify wheel (${{ matrix.target }}, ${{ matrix.runner }}, Python ${{ matrix.python-version }})
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64
            python-version: "3.11"
          - runner: ubuntu-24.04
            target: x86_64
            python-version: "3.14"
          - runner: ubuntu-24.04-arm
            target: aarch64
            python-version: "3.12"
          - runner: macos-15
            target: universal2-apple-darwin
            python-version: "3.12"
          - runner: macos-15-intel
            target: universal2-apple-darwin
            python-version: "3.12"
          - runner: windows-2025
            target: x64
            python-version: "3.12"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: dist

      - name: Install the wheel
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          uv venv --python "$PYTHON_VERSION" wheel-env
          wheel=$(ls dist/*.whl)
          uv pip install --python wheel-env "$wheel"

      - name: Load the kernel and solve a line
        run: |
          cat > smoke.py <<'PY'
          from importlib.metadata import version

          import lineforge
          from lineforge import _kernel

          assert lineforge.__version__ == version("lineforge"), lineforge.__version__
          assert _kernel.version() == lineforge.__version__, _kernel.version()
          z0 = lineforge.microstrip(W="6mil", H="4mil", T="1.4mil", er=4.4).z0
          assert 40 < z0 < 60, z0
          print(lineforge.__version__, f"Z0 = {z0:.2f}")
          PY
          if [ -x wheel-env/Scripts/python.exe ]; then bin=wheel-env/Scripts; else bin=wheel-env/bin; fi
          "$bin/python" -I smoke.py
          "$bin/lineforge" --version

  # A wheel built from the sdist proves the sdist is complete, for platforms with no wheel above.
  verify-sdist:
    needs: [sdist, wheels]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Check the package metadata
        run: uvx twine check --strict dist/*

      - name: Build and load a wheel from the sdist
        run: |
          uv build --python 3.12 --wheel --out-dir from-sdist dist/*.tar.gz
          uv venv --python 3.12 wheel-env
          uv pip install --python wheel-env from-sdist/*.whl
          wheel-env/bin/python -I -c 'from lineforge import _kernel; print(_kernel.version())'

  publish:
    if: github.ref_type == 'tag'
    needs: [verify-wheels, verify-sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/lineforge
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in
            *a*|*b*|*rc*) flags="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $flags dist/*
